[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-calcs"
version = "0.1.0"
description = "Commercial real estate investment scenario metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tabulate>=0.9.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "reportlab>=4.0"]
gui = ["streamlit>=1.28", "reportlab>=4.0", "pandas>=2.0"]

[project.scripts]
cre-scenarios = "cre_calcs.cli:main"
cre-wizard = "cre_calcs.wizard:run_wizard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
